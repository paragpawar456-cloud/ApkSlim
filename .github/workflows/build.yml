name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :core:test assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ApkSlim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ApkSlim-release
          path: ApkSlim.apk
      # Pushing a tag like v1.0.0 publishes the APK as a GitHub Release with a direct download link.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ApkSlim.apk --title "ApkSlim $GITHUB_REF_NAME" \
            --notes "Download **ApkSlim.apk** below and install it (allow installs from unknown sources when asked)."
