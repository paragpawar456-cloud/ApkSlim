name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :core:test assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ApkSlim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ApkSlim-release
          path: ApkSlim.apk
      # Every push to main publishes the APK on the "latest" release (direct download link).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ApkSlim.apk --clobber
          else
            gh release create latest ApkSlim.apk --target "$GITHUB_SHA" --title "ApkSlim (latest build)" \
              --notes "Download **ApkSlim.apk** below and install it (allow installs from unknown sources when asked)."
          fi
