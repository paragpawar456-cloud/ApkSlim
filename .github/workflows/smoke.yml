name: Smoke test on emulator
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and capture logcat + screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/smoke.sh
      - name: Publish screenshots to the screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r shots/. /tmp/shots/ 2>/dev/null || true
          git config user.name "ApkSlim CI"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf . -q
          cp -r /tmp/shots/. .
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}" || exit 0
          git push -f origin screenshots
